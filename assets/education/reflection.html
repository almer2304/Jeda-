<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refleksi Harian</title>
    <style>
        :root {
            --bg-color: #F5F0E8;
            --text-color: #2D2D2D;
            --accent-color: #87A878;
            --input-bg: #FFFFFF;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 420px;
            width: 100%;
        }
        .back-btn {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        .date-display {
            color: #666;
            margin-bottom: 32px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 24px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        textarea {
            width: 100%;
            box-sizing: border-box;
            background-color: var(--input-bg);
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-family: inherit;
            font-size: 16px;
            color: var(--text-color);
            resize: vertical;
            min-height: 100px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        textarea:focus {
            outline: 2px solid var(--accent-color);
        }
        .save-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 24px;
            padding: 16px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 16px;
            margin-bottom: 32px;
            transition: opacity 0.2s;
        }
        .save-btn:active {
            opacity: 0.8;
        }
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--text-color);
            color: white;
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">← Kembali</a>
        
        <h1>Refleksi Harian ✍️</h1>
        <div class="date-display" id="dateDisplay"></div>

        <div class="form-group">
            <label for="q1">Apa yang ingin kamu capai hari ini tanpa distraksi?</label>
            <textarea id="q1" placeholder="Tuliskan tujuanmu..."></textarea>
        </div>

        <div class="form-group">
            <label for="q2">Kapan biasanya kamu membuka aplikasi/game pelarian tanpa tujuan?</label>
            <textarea id="q2" placeholder="Misal: Saat jam istirahat siang, bosan, atau sebelum tidur..."></textarea>
        </div>

        <div class="form-group">
            <label for="q3">Satu hal kecil yang berbeda yang bisa kamu coba hari ini?</label>
            <textarea id="q3" placeholder="Misal: Meninggalkan HP di meja saat ke toilet..."></textarea>
        </div>

        <button class="save-btn" onclick="saveReflection()">Simpan Refleksi</button>
    </div>

    <div class="toast" id="toast">Tersimpan! 🌿</div>

    <script>
        // Set date
        const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const today = new Date();
        document.getElementById('dateDisplay').textContent = today.toLocaleDateString('id-ID', dateOptions);

        const storageKey = 'reflection_' + today.toISOString().split('T')[0];

        // Load existing
        window.onload = () => {
            const savedData = localStorage.getItem(storageKey);
            if (savedData) {
                const data = JSON.parse(savedData);
                document.getElementById('q1').value = data.q1 || '';
                document.getElementById('q2').value = data.q2 || '';
                document.getElementById('q3').value = data.q3 || '';
            }
        };

        // Save
        function saveReflection() {
            const data = {
                q1: document.getElementById('q1').value,
                q2: document.getElementById('q2').value,
                q3: document.getElementById('q3').value
            };
            localStorage.setItem(storageKey, JSON.stringify(data));
            
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
    </script>
</body>
</html>
