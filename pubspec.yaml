name: jeda
description: MindfulLock - Teman sadar, bukan penjara digital.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  flutter_inappwebview: ^6.0.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  uuid: ^4.4.0
  shared_preferences: ^2.5.5
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/education/
    - assets/education/articles/
    - assets/google_icon.png


flutter_launcher_icons:
  android: true
  ios: false
  image_path: "screen.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "screen.png"
